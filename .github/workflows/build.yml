name: binder-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Recon headers
        run: |
          OUT=report.txt
          exec > >(tee $OUT) 2>&1
          set -x
          uname -r
          ls -la /lib/modules/$(uname -r)/ 2>&1 | head -20
          apt-cache policy linux-headers-$(uname -r) 2>&1 | head -10
          apt-cache search "linux-headers-6.17" 2>&1 | head -20
          apt-cache search linux-modules-extra 2>&1 | head -20
          ls /usr/src 2>&1
          cat /etc/apt/sources.list.d/*.sources 2>/dev/null | head -40
          apt-cache search "azure" 2>&1 | grep -i headers | head -20
      - name: Publish report
        if: always()
        run: |
          mkdir -p out && cp report.txt out/report.txt
          cd out && git init -q && git config user.email p@l && git config user.name p
          git add -A && git commit -q -m "recon $(date -u +%s)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:recon
