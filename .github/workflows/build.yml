name: binder-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Mount binderfs and start real redroid Android
        run: |
          OUT=report.txt
          exec > >(tee $OUT) 2>&1
          set -x
          echo "=== existing binder state ==="
          sudo modprobe binder_linux 2>&1 || true
          ls -la /dev/binder* 2>&1
          grep -i binder /proc/filesystems || echo "no binderfs in /proc/filesystems"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs 2>&1 && echo BINDERFS_OK || echo BINDERFS_FAIL
          ls -la /dev/binderfs 2>&1
          echo "=== if binderfs failed, insmod our ko ==="
          if ! ls /dev/binderfs/binder >/dev/null 2>&1; then
            echo "need our module"
          fi
          grep -i binder /proc/filesystems
          echo "=== android modules for redroid ==="
          for m in binder_linux ashmem_linux; do sudo modprobe $m 2>&1 || echo "no $m"; done
          lsmod | grep -iE 'binder|ashmem' || echo none_loaded
      - name: Publish
        if: always()
        run: |
          mkdir -p out && cp report.txt out/report.txt
          cd out && git init -q && git config user.email p@l && git config user.name p
          git add -A && git commit -q -m "b6 $(date -u +%s)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:recon
