name: binder-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Get binder sources and build
        run: |
          OUT=report.txt
          exec > >(tee $OUT) 2>&1
          set -x
          K=$(uname -r)
          H=/usr/src/linux-headers-$K
          W=/tmp/bk; rm -rf $W; mkdir -p $W; cd $W
          echo "### source of truth: kernel.org 6.17"
          curl -sSL -o lx.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.17.tar.xz || echo DL_FAIL_mainline
          ls -la lx.tar.xz
          tar -xf lx.tar.xz linux-6.17/drivers/android || echo TAR_FAIL
          ls -la linux-6.17/drivers/android 2>&1
      - name: Publish
        if: always()
        run: |
          mkdir -p out && cp report.txt out/report.txt
          cd out && git init -q && git config user.email p@l && git config user.name p
          git add -A && git commit -q -m "b2 $(date -u +%s)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:recon
