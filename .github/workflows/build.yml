name: binder-build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Show binder sources in headers
        run: |
          OUT=report.txt
          exec > >(tee $OUT) 2>&1
          K=$(uname -r)
          H=/usr/src/linux-headers-$K
          echo "== tree =="
          ls $H
          echo "== drivers/android =="
          ls -la $H/drivers/android 2>&1
          echo "== find binder c =="
          find $H -name '*binder*' 2>/dev/null | head -40
          echo "== Module.symvers =="
          ls -la $H/Module.symvers 2>&1
          echo "== config =="
          grep -iE 'BINDER|ASHMEM' $H/.config 2>&1
          echo "== staging =="
          ls $H/drivers/staging/android 2>&1
      - name: Publish
        if: always()
        run: |
          mkdir -p out && cp report.txt out/report.txt
          cd out && git init -q && git config user.email p@l && git config user.name p
          git add -A && git commit -q -m "src $(date -u +%s)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:recon
